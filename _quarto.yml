format:
  html:
    theme:
      light: [serif, fonts.scss, shared.scss, html-style.scss]
      dark: [serif, fonts.scss, shared.scss, html-style.scss, html-style-dark.scss]
    respect-user-color-scheme: true
    toc: true
    toc-depth: 3
    shift-heading-level-by: 1
    smooth-scroll: false
    code-copy: hover
    include-after-body:
      text: |
        <script>
        (function () {
          document.querySelectorAll('#quarto-sidebar .sidebar-item-section').forEach(function (section) {
            var heading = section.querySelector('.sidebar-item-container .menu-text');
            if (!heading || heading.textContent.trim() !== 'Exercises') return;
            var list = section.querySelector('ul.sidebar-section');
            if (!list || list.querySelector('.sidebar-link.active')) return;
            list.classList.remove('show');
            section.querySelectorAll('a[data-bs-toggle="collapse"]').forEach(function (a) {
              a.setAttribute('aria-expanded', 'false');
              a.classList.add('collapsed');
            });
          });
        })();
        </script>

  revealjs:
    output-ext: "slides.html"
    theme: [serif, fonts.scss, shared.scss, revealjs-style.scss]
    controls: true
    controls-tutorial: true
    logo: unsw-logo.png
    transition: none
    slide-number: c/t
    preview-links: false
    margin: 0.10
    width: 1120
    height: 700
    chalkboard:
      boardmarker-width: 4
      grid: false
      background:
        - "rgba(255,255,255,0.0)"
    history: false
    code-annotations: none
    include-before-body:
      text: |
        <script>
          let selectedAnnoteEl;
        </script>
    include-after-body:
      file: chalkboard-fixes.html
    filters:
      - reveal-auto-agenda
    auto-agenda:
      heading: Lecture Outline

subtitle: ACTL3143 & ACTL5111 Deep Learning for Actuaries
author: Patrick Laub
bibliography: library.bib
csl: apa.csl
strip-comments: true
lightbox: false
html-math-method: katex
syntax-highlighting: blue-pygments.theme
syntax-definitions:
  - python.xml
pdf-engine: pdflatex
execute:
  echo: true
  freeze: false
  daemon: false
  cache: true
