# pygam's metadata caps scipy at <1.17, but that's an over-conservative "tested
# up to" pin, not a real incompatibility: pygam 0.12 only uses stable scipy
# sparse/stats/linalg APIs and fits fine on scipy 1.18. Override that cap so
# `uv pip install -r requirements.in` can resolve the latest scipy.
# (Overrides can't live in requirements.in; uv reads this file automatically.)
override-dependencies = ["scipy>=1.17"]
