format:
  html:
    theme:
      light: [serif, fonts.scss, shared.scss, html-style.scss]
      dark: [serif, fonts.scss, shared.scss, html-style.scss, html-style-dark.scss]
    respect-user-color-scheme: true
    toc: true
    toc-depth: 3
    shift-heading-level-by: 1
    smooth-scroll: false
    code-copy: hover
    filters:
      # Strip random Jupyter cell ids / execution counts and canonicalise
      # layout-* attribute order, so the committed HTML is deterministic.
      - at: post-render
        path: filters/deterministic-html.lua

  revealjs:
    output-ext: "slides.html"
    # Keep slide decks out of the website's search index — the site search
    # should send students to the reading page, not into a slide deck. The
    # decks stay reachable through each page's "Other Formats" links.
    search: false
    theme: [serif, fonts.scss, shared.scss, revealjs-style.scss]
    controls: true
    controls-tutorial: true
    navigation-mode: linear
    logo: unsw-logo.png
    transition: none
    slide-number: c/t
    preview-links: false
    margin: 0.10
    width: 1120
    height: 700
    title-slide-attributes:
      data-background-image: /title-background.svg
      data-background-size: contain
      data-background-position: center
    chalkboard:
      transition: 1
      boardmarker-width: 4
      grid: false
      background:
        - "rgba(255,255,255,0.0)"
    history: false
    code-annotations: none
    include-after-body:
      file: reveal-fixes.html
    filters:
      - reveal-auto-agenda
      - at: post-render
        path: filters/deterministic-html.lua
    auto-agenda:
      heading: Lecture Outline

subtitle: ACTL3143 & ACTL5111 Deep Learning for Actuaries
author: Patrick Laub
bibliography: library.bib
csl: apa.csl
strip-comments: true
lightbox: false
html-math-method: katex
syntax-highlighting: blue-pygments.theme
syntax-definitions:
  - python.xml
pdf-engine: pdflatex
execute:
  echo: true
  freeze: false
  daemon: false
  cache: true
