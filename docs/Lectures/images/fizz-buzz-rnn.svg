<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1960 640" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="black"/>
    </marker>
  </defs>

  <style>
    .cell { fill: #92cccc; stroke: black; stroke-width: 4; }
    .arr  { stroke: black; stroke-width: 4; fill: none; marker-end: url(#arrow); }
    .darr { stroke: black; stroke-width: 4; fill: none; stroke-dasharray: 14 12; marker-end: url(#arrow); }
    .say  { font-size: 52px; text-anchor: middle; }
    .pass { font-size: 44px; text-anchor: middle; }
    .start{ font-size: 46px; text-anchor: middle; }
  </style>

  <!-- cells: x positions of left edge -->
  <!-- cell width 200, height 120, top y = 250 -->

  <!-- Cell 1 -->
  <rect class="cell" x="60"   y="250" width="200" height="120" rx="22"/>
  <!-- Cell 2 -->
  <rect class="cell" x="420"  y="250" width="200" height="120" rx="22"/>
  <!-- Cell 3 -->
  <rect class="cell" x="780"  y="250" width="200" height="120" rx="22"/>
  <!-- Cell 4 -->
  <rect class="cell" x="1140" y="250" width="200" height="120" rx="22"/>
  <!-- Cell 5 -->
  <rect class="cell" x="1500" y="250" width="200" height="120" rx="22"/>

  <!-- Top outputs (what the player says): 1, 2, Fizz, 4, Buzz -->
  <line class="arr" x1="160"  y1="250" x2="160"  y2="120"/>
  <line class="arr" x1="520"  y1="250" x2="520"  y2="120"/>
  <line class="arr" x1="880"  y1="250" x2="880"  y2="120"/>
  <line class="arr" x1="1240" y1="250" x2="1240" y2="120"/>
  <line class="arr" x1="1600" y1="250" x2="1600" y2="120"/>

  <text class="say" x="160"  y="90">&#8220;1&#8221;</text>
  <text class="say" x="520"  y="90">&#8220;2&#8221;</text>
  <text class="say" x="880"  y="90">&#8220;Fizz&#8221;</text>
  <text class="say" x="1240" y="90">&#8220;4&#8221;</text>
  <text class="say" x="1600" y="90">&#8220;Buzz&#8221;</text>

  <!-- Bottom input: only the first cell, "START" -->
  <line class="arr" x1="160" y1="500" x2="160" y2="370"/>
  <text class="start" x="160" y="560">START</text>

  <!-- Horizontal passed numbers (the running count) -->
  <line class="arr" x1="260"  y1="310" x2="420"  y2="310"/>
  <line class="arr" x1="620"  y1="310" x2="780"  y2="310"/>
  <line class="arr" x1="980"  y1="310" x2="1140" y2="310"/>
  <line class="arr" x1="1340" y1="310" x2="1500" y2="310"/>
  <line class="darr" x1="1700" y1="310" x2="1900" y2="310"/>

  <text class="pass" x="340"  y="290">1</text>
  <text class="pass" x="700"  y="290">2</text>
  <text class="pass" x="1060" y="290">3</text>
  <text class="pass" x="1420" y="290">4</text>
  <text class="pass" x="1800" y="290">5</text>
</svg>
