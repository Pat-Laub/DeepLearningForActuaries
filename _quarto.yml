project:
  title: "AI for Actuaries"
  type: website
  render:
    - "*.qmd"
    - "!*.ipynb"
    - "!*.md"
  output-dir: docs
  post-render:
    - scripts/remove_cell_ids.py
    - scripts/decktape_pdfs.py

website:
  title: "AI for Actuaries"
  google-analytics: "G-J0TZXJ0Y33" 
  page-navigation: true
  sidebar:
    contents:
      - href: index.qmd
        text: Home
      - section: "Preliminaries"
        contents:
          - Lectures/python.qmd
          - Lectures/python-for-data-science.qmd
      - section: "Week 1"
        contents:
          - Lectures/ai-and-deep-learning.qmd
          - Lectures/preprocessing.qmd
          - Lectures/optimisation.qmd
      - section: "Week 2"
        contents:
          - Lectures/classification.qmd
          - Lectures/natural-language-processing.qmd
          - Lectures/entity-embedding.qmd
      - section: "Week 3"
        contents:
          - Lectures/computer-vision.qmd
      - section: "Week 4"
        contents:
          - Lectures/time-series-and-rnns.qmd
      - section: "Week 5"
        contents:
          - Lectures/distributional-regression.qmd
      - section: "Weeks 7-10"
        contents:
          - Lectures/interpretability.qmd
          - Lectures/generative-networks.qmd
      - section: "Labs"
        contents:
          - Labs/python-lab.qmd
          - Labs/python-for-data-science-lab.qmd
          - Labs/matplotlib-lab.qmd
          - Labs/latex-lab.qmd
          - Labs/forward-pass-lab.qmd
          - Labs/optimisation-lab.qmd
          - Labs/backpropagation-lab.qmd
          - Labs/distributional-regression-lab.qmd
      - section: "Exercises"
        contents:
          - Exercises/victorian-crash-severity.qmd
          - Exercises/french-motor-frequency.qmd
          - Exercises/police-reports.qmd
          - Exercises/hurricane-damage.qmd
          - Exercises/sydney-airport-temperature.qmd

format:
  html:
    theme: [serif, shared.scss, html-style.scss]
    toc: true
    toc-depth: 3
    shift-heading-level-by: 1
    smooth-scroll: false
    code-copy: hover

  revealjs:
    output-ext: "slides.html"
    theme: [serif, shared.scss, revealjs-style.scss]
    controls: true
    controls-tutorial: true
    logo: unsw-logo.png
    transition: none
    slide-number: c/t
    preview-links: false
    margin: 0.10
    width: 1120
    height: 700
    chalkboard:
      boardmarker-width: 4
      grid: false
      background:
        - "rgba(255,255,255,0.0)"
        - "https://github.com/rajgoel/reveal.js-plugins/raw/master/chalkboard/img/blackboard.png"
    history: false
    code-annotations: none
    include-before-body:
      text: |
        <script>
          let selectedAnnoteEl;
        </script>
    filters:
      - reveal-auto-agenda
    auto-agenda:
      heading: Lecture Outline

subtitle: ACTL3143 & ACTL5111 Deep Learning for Actuaries
author: Patrick Laub
bibliography: library.bib
csl: apa.csl
strip-comments: true
lightbox: false
html-math-method: katex
syntax-highlighting: blue-pygments.theme
syntax-definitions:
  - python.xml
pdf-engine: pdflatex
execute:
  echo: true
  freeze: false
  daemon: false
  cache: true
