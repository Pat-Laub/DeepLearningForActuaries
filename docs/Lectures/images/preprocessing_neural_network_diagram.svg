<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1000" viewBox="0 220 2400 1000" role="img" aria-labelledby="title desc">
  <title id="title">Preprocessing: transforming raw data into neural-network input</title>
  <desc id="desc">A vector infographic showing raw messy data flowing through cleaning, transforming, reshaping, and combining steps to become processed numerical data usable by a neural network.</desc>
  <defs>
    <linearGradient id="rawGrad" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fffafa"/>
      <stop offset="1" stop-color="#fff4f4"/>
    </linearGradient>
    <linearGradient id="prepGrad" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fbfdff"/>
      <stop offset="1" stop-color="#f3f8ff"/>
    </linearGradient>
    <linearGradient id="procGrad" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fbfffb"/>
      <stop offset="1" stop-color="#f1fbf4"/>
    </linearGradient>
    <linearGradient id="nnGrad" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fffaff"/>
      <stop offset="1" stop-color="#faf5ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#64748b" flood-opacity="0.16"/>
    </filter>
    <style>
      .title { font: 700 52px Arial, Helvetica, sans-serif; fill: #12356b; letter-spacing: 1px; }
      .subtitle { font: 400 28px Arial, Helvetica, sans-serif; fill: #334155; }
      .panel-title { font: 700 30px Arial, Helvetica, sans-serif; }
      .step-title { font: 700 26px Arial, Helvetica, sans-serif; fill: #12356b; }
      .body { font: 400 24px Arial, Helvetica, sans-serif; fill: #1f2937; }
      .small { font: 400 18px Arial, Helvetica, sans-serif; fill: #1f2937; }
      .tiny { font: 400 14px Arial, Helvetica, sans-serif; fill: #1f2937; }
      .mono { font: 400 12px 'Courier New', monospace; fill: #111827; }
      .green-text { fill:#18733b; }
      .red-text { fill:#a11e25; }
      .blue-text { fill:#0958b7; }
      .purple-text { fill:#6d34a0; }
      .muted { fill:#64748b; }
      .bracket { fill:none; stroke:#334155; stroke-width:3; stroke-linecap:round; }
    </style>
  </defs>

  <rect x="0" y="220" width="2400" height="1000" fill="#ffffff"/>

  <!-- Raw data panel -->
  <rect x="36" y="260" width="360" height="765" rx="18" fill="url(#rawGrad)" stroke="#de3b3b" stroke-width="2.5"/>
  <text x="216" y="312" text-anchor="middle" class="panel-title red-text">RAW DATA</text>
  <text x="216" y="360" text-anchor="middle" class="body">Unprocessed, messy,</text>
  <text x="216" y="394" text-anchor="middle" class="body">inconsistent</text>

  <!-- messy table icon -->
  <g transform="translate(63,440)" filter="url(#shadow)">
    <path d="M0,0 h42 l22,22 v155 h-64z" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <path d="M42,0 v22 h22" fill="none" stroke="#94a3b8" stroke-width="2"/>
    <path d="M12,18 h36 M12,34 h40" stroke="#cbd5e1" stroke-width="3"/>
    <path d="M18,24 h42 l22,22 v155 h-64z" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" opacity="0.85"/>
    <path d="M60,24 v22 h22" fill="none" stroke="#94a3b8" stroke-width="2"/>
    <rect x="45" y="52" width="260" height="150" fill="#fff" stroke="#94a3b8" stroke-width="2"/>
    <text x="68" y="84" class="mono">id,  name,  age, city, income</text>
    <text x="68" y="116" class="mono">1, John Doe, , "NY, NY", 50000</text>
    <text x="68" y="148" class="mono">2,       25,  LA ,    …</text>
    <text x="68" y="180" class="mono">3, María, 32, “München”, 62000</text>
  </g>

  <!-- image stack -->
  <g transform="translate(55,698) scale(0.74)" filter="url(#shadow)">
    <rect x="0" y="20" width="130" height="90" fill="#eff6ff" stroke="#93c5fd" stroke-width="3"/>
    <rect x="12" y="10" width="130" height="90" fill="#eff6ff" stroke="#93c5fd" stroke-width="3"/>
    <rect x="24" y="0" width="130" height="90" fill="#dbeafe" stroke="#93c5fd" stroke-width="3"/>
    <rect x="36" y="14" width="100" height="62" fill="#bae6fd"/>
    <path d="M36,76 L74,45 L101,65 L121,36 L136,76 Z" fill="#4f8d63"/>
    <circle cx="75" cy="35" r="8" fill="#ffffff" opacity="0.9"/>
  </g>
  <text x="185" y="730" class="body">Images of</text>
  <text x="185" y="764" class="body">varying sizes</text>

  <!-- audio icon -->
  <g transform="translate(55,866)">
    <path d="M2,24 h18 l26,-21 v84 l-26,-21 h-18 z" fill="#94a3b8" stroke="#64748b" stroke-width="2.5"/>
    <path d="M60,30 v36 M80,16 v64 M100,38 v20" stroke="#334155" stroke-width="4.5" stroke-linecap="round"/>
  </g>
  <text x="185" y="896" class="body">Audio recordings</text>
  <text x="185" y="930" class="body">with noise</text>

  <!-- preprocessing box -->
  <rect x="475" y="268" width="1090" height="750" rx="22" fill="url(#prepGrad)" stroke="#2b73d2" stroke-width="3" stroke-dasharray="18 14"/>

  <!-- arrows between large panels -->
  <path d="M407.5,604 L431.5,604 L431.5,591 L463.5,610 L431.5,629 L431.5,616 L407.5,616 Z" fill="#4b5563"/>
  <path d="M1579.5,604 L1603.5,604 L1603.5,591 L1635.5,610 L1603.5,629 L1603.5,616 L1579.5,616 Z" fill="#4b5563"/>
  <path d="M1994.5,604 L2018.5,604 L2018.5,591 L2050.5,610 L2018.5,629 L2018.5,616 L1994.5,616 Z" fill="#4b5563"/>

  <!-- Steps 1-4 + inter-step arrows, nudged left so the group is centred in the preprocessing box -->
  <g transform="translate(-12.5,0)">
  <!-- Step 1 -->
  <g transform="translate(515,435)">
    <rect x="0" y="0" width="205" height="315" rx="14" fill="#f8fbff" stroke="#74a7e5" stroke-width="2.5" filter="url(#shadow)"/>
    <text x="102.5" y="44" text-anchor="middle" class="step-title">1. CLEAN</text>
    <g transform="translate(32.5,95)">
      <rect x="0" y="0" width="140" height="140" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
      <path d="M0,46.7 h140 M0,93.4 h140 M46.7,0 v140 M93.4,0 v140" stroke="#334155" stroke-width="2"/>
      <rect x="47" y="47" width="46" height="46" fill="#fca5a5" opacity="0.75"/>
      <rect x="0" y="94" width="47" height="46" fill="#fca5a5" opacity="0.75"/>
    </g>
  </g>
  <text x="618" y="803" text-anchor="middle" class="body">Handle missing</text>
  <text x="618" y="837" text-anchor="middle" class="body">values, remove</text>
  <text x="618" y="871" text-anchor="middle" class="body">duplicates,</text>
  <text x="618" y="905" text-anchor="middle" class="body">fix errors</text>

  <!-- Step 2 -->
  <g transform="translate(765,435)">
    <rect x="0" y="0" width="260" height="315" rx="14" fill="#f8fbff" stroke="#74a7e5" stroke-width="2.5" filter="url(#shadow)"/>
    <text x="130" y="44" text-anchor="middle" class="step-title">2. TRANSFORM</text>
    <g transform="translate(25,100)">
      <rect x="0" y="0" width="55" height="140" fill="#f8fafc" stroke="#334155" stroke-width="3" rx="4"/>
      <circle cx="27.5" cy="35" r="4" fill="#334155"/>
      <circle cx="27.5" cy="70" r="4" fill="#334155"/>
      <circle cx="27.5" cy="105" r="4" fill="#334155"/>
      <path d="M85,67.5 L99,67.5 L99,61 L115,70 L99,79 L99,72.5 L85,72.5 Z" fill="#4b5563"/>
      <rect x="145" y="0" width="65" height="140" fill="#f8fafc" stroke="#334155" stroke-width="3" rx="4"/>
      <text x="177.5" y="36" text-anchor="middle" font-family="Arial" font-size="25" fill="#15803d">0.2</text>
      <text x="177.5" y="76" text-anchor="middle" font-family="Arial" font-size="25" fill="#15803d">-1.1</text>
      <text x="177.5" y="116" text-anchor="middle" font-family="Arial" font-size="25" fill="#15803d">0.7</text>
    </g>
  </g>
  <text x="895" y="803" text-anchor="middle" class="body">Normalise/scale</text>
  <text x="895" y="837" text-anchor="middle" class="body">features,</text>
  <text x="895" y="871" text-anchor="middle" class="body">encode categorical</text>
  <text x="895" y="905" text-anchor="middle" class="body">variables</text>

  <!-- Step 3 -->
  <g transform="translate(1070,435)">
    <rect x="0" y="0" width="245" height="315" rx="14" fill="#f8fbff" stroke="#74a7e5" stroke-width="2.5" filter="url(#shadow)"/>
    <text x="122.5" y="44" text-anchor="middle" class="step-title">3. RESHAPE</text>
    <g transform="translate(22.5,105)">
      <rect x="0" y="45" width="48" height="48" fill="#93c5fd" stroke="#2563eb" stroke-width="2"/>
      <path d="M16,45 v48 M32,45 v48 M0,61 h48 M0,77 h48" stroke="#2563eb" stroke-width="1.5"/>
      <path d="M70,67.5 L84,67.5 L84,61 L100,70 L84,79 L84,72.5 L70,72.5 Z" fill="#4b5563"/>
      <rect x="122" y="0" width="78" height="140" fill="#93c5fd" stroke="#2563eb" stroke-width="3"/>
      <path d="M141.5,0 v140 M161,0 v140 M180.5,0 v140 M122,35 h78 M122,70 h78 M122,105 h78" stroke="#2563eb" stroke-width="1.5" opacity="0.75"/>
      <circle cx="161" cy="70" r="5" fill="#1e3a8a"/>
    </g>
  </g>
  <text x="1193" y="803" text-anchor="middle" class="body">Resize images,</text>
  <text x="1193" y="837" text-anchor="middle" class="body">convert text to</text>
  <text x="1193" y="871" text-anchor="middle" class="body">sequences/tokens,</text>
  <text x="1193" y="905" text-anchor="middle" class="body">standardise shape</text>

  <!-- Step 4 -->
  <g transform="translate(1360,435)">
    <rect x="0" y="0" width="190" height="315" rx="14" fill="#f8fbff" stroke="#74a7e5" stroke-width="2.5" filter="url(#shadow)"/>
    <text x="95" y="44" text-anchor="middle" class="step-title">4. COMBINE</text>
    <g transform="translate(50,90)">
      <path d="M15,0 h-15 v180 h15" fill="none" stroke="#111827" stroke-width="3"/>
      <path d="M75,0 h15 v180 h-15" fill="none" stroke="#111827" stroke-width="3"/>
      <circle cx="45" cy="35" r="10" fill="#60a5fa" stroke="#1e3a8a" stroke-width="2"/>
      <circle cx="45" cy="72" r="10" fill="#60a5fa" stroke="#1e3a8a" stroke-width="2"/>
      <circle cx="45" cy="109" r="10" fill="#60a5fa" stroke="#1e3a8a" stroke-width="2"/>
      <circle cx="45" cy="146" r="10" fill="#60a5fa" stroke="#1e3a8a" stroke-width="2"/>
    </g>
  </g>
  <text x="1455" y="803" text-anchor="middle" class="body">Assemble into a</text>
  <text x="1455" y="837" text-anchor="middle" class="body">structured</text>
  <text x="1455" y="871" text-anchor="middle" class="body">numerical</text>
  <text x="1455" y="905" text-anchor="middle" class="body">representation</text>

  <!-- arrows inside preprocessing -->
  <path d="M725.5,606.5 L739.5,606.5 L739.5,598 L759.5,610 L739.5,622 L739.5,613.5 L725.5,613.5 Z" fill="#4b5563"/>
  <path d="M1030.5,606.5 L1044.5,606.5 L1044.5,598 L1064.5,610 L1044.5,622 L1044.5,613.5 L1030.5,613.5 Z" fill="#4b5563"/>
  <path d="M1320.5,606.5 L1334.5,606.5 L1334.5,598 L1354.5,610 L1334.5,622 L1334.5,613.5 L1320.5,613.5 Z" fill="#4b5563"/>
  </g>

  <!-- Processed data panel -->
  <rect x="1650" y="260" width="340" height="765" rx="18" fill="url(#procGrad)" stroke="#4a9b64" stroke-width="2.5"/>
  <text x="1820" y="312" text-anchor="middle" class="panel-title green-text">PROCESSED DATA</text>
  <text x="1820" y="360" text-anchor="middle" class="body">Clean, consistent,</text>
  <text x="1820" y="394" text-anchor="middle" class="body">numerical input</text>
  <g transform="translate(1672,500)">
    <path d="M20,0 h-15 v270 h15" class="bracket"/>
    <path d="M275,0 h15 v270 h-15" class="bracket"/>
    <text x="60" y="35" text-anchor="middle" font-family="Arial" font-size="24" fill="#111827"><tspan font-style="italic">f</tspan><tspan font-size="15" dy="6" font-style="italic">1</tspan></text>
    <text x="130" y="35" text-anchor="middle" font-family="Arial" font-size="24" fill="#111827"><tspan font-style="italic">f</tspan><tspan font-size="15" dy="6" font-style="italic">2</tspan></text>
    <text x="195" y="35" text-anchor="middle" font-family="Arial" font-size="24" fill="#111827">...</text>
    <text x="250" y="35" text-anchor="middle" font-family="Arial" font-size="24" fill="#111827"><tspan font-style="italic">f</tspan><tspan font-size="15" dy="6" font-style="italic">n</tspan></text>
    <text x="60" y="86" text-anchor="middle" font-family="Arial" font-size="24" fill="#15803d">0.21</text>
    <text x="130" y="86" text-anchor="middle" font-family="Arial" font-size="24" fill="#15803d">-1.02</text>
    <text x="195" y="86" text-anchor="middle" font-family="Arial" font-size="24" fill="#15803d">...</text>
    <text x="250" y="86" text-anchor="middle" font-family="Arial" font-size="24" fill="#15803d">0.33</text>
    <text x="60" y="142" text-anchor="middle" font-family="Arial" font-size="24" fill="#15803d">-0.56</text>
    <text x="130" y="142" text-anchor="middle" font-family="Arial" font-size="24" fill="#15803d">0.11</text>
    <text x="195" y="142" text-anchor="middle" font-family="Arial" font-size="24" fill="#15803d">...</text>
    <text x="250" y="142" text-anchor="middle" font-family="Arial" font-size="24" fill="#15803d">-0.75</text>
    <text x="60" y="198" text-anchor="middle" font-family="Arial" font-size="24" fill="#15803d">0.78</text>
    <text x="130" y="198" text-anchor="middle" font-family="Arial" font-size="24" fill="#15803d">-0.23</text>
    <text x="195" y="198" text-anchor="middle" font-family="Arial" font-size="24" fill="#15803d">...</text>
    <text x="250" y="198" text-anchor="middle" font-family="Arial" font-size="24" fill="#15803d">1.05</text>
    <text x="60" y="248" text-anchor="middle" font-family="Arial" font-size="24" fill="#15803d">...</text>
    <text x="130" y="248" text-anchor="middle" font-family="Arial" font-size="24" fill="#15803d">...</text>
    <text x="195" y="248" text-anchor="middle" font-family="Arial" font-size="24" fill="#15803d">...</text>
    <text x="250" y="248" text-anchor="middle" font-family="Arial" font-size="24" fill="#15803d">...</text>
  </g>
  <text x="1820" y="860" text-anchor="middle" class="body">Fixed shape</text>
  <text x="1820" y="894" text-anchor="middle" class="body">e.g., batch × features</text>
  <text x="1820" y="928" text-anchor="middle" class="body">ready for input</text>

  <!-- Neural network panel -->
  <rect x="2055" y="260" width="320" height="765" rx="18" fill="url(#nnGrad)" stroke="#a56de0" stroke-width="2.5"/>
  <text x="2215" y="312" text-anchor="middle" class="panel-title purple-text">NEURAL NETWORK</text>
  <text x="2215" y="360" text-anchor="middle" class="body">Data is now usable</text>
  <text x="2215" y="394" text-anchor="middle" class="body">as input</text>

  <!-- neural network drawing -->
  <g transform="translate(2065,505)">
    <!-- edges -->
    <g stroke="#64748b" stroke-width="2" opacity="0.85">
      <!-- layer 1 to 2 -->
      <line x1="30" y1="0" x2="110" y2="0"/><line x1="30" y1="0" x2="110" y2="55"/><line x1="30" y1="0" x2="110" y2="110"/><line x1="30" y1="0" x2="110" y2="165"/>
      <line x1="30" y1="55" x2="110" y2="0"/><line x1="30" y1="55" x2="110" y2="55"/><line x1="30" y1="55" x2="110" y2="110"/><line x1="30" y1="55" x2="110" y2="165"/>
      <line x1="30" y1="110" x2="110" y2="0"/><line x1="30" y1="110" x2="110" y2="55"/><line x1="30" y1="110" x2="110" y2="110"/><line x1="30" y1="110" x2="110" y2="165"/>
      <line x1="30" y1="165" x2="110" y2="0"/><line x1="30" y1="165" x2="110" y2="55"/><line x1="30" y1="165" x2="110" y2="110"/><line x1="30" y1="165" x2="110" y2="165"/>
      <!-- layer 2 to 3 -->
      <line x1="110" y1="0" x2="190" y2="0"/><line x1="110" y1="0" x2="190" y2="55"/><line x1="110" y1="0" x2="190" y2="110"/><line x1="110" y1="0" x2="190" y2="165"/>
      <line x1="110" y1="55" x2="190" y2="0"/><line x1="110" y1="55" x2="190" y2="55"/><line x1="110" y1="55" x2="190" y2="110"/><line x1="110" y1="55" x2="190" y2="165"/>
      <line x1="110" y1="110" x2="190" y2="0"/><line x1="110" y1="110" x2="190" y2="55"/><line x1="110" y1="110" x2="190" y2="110"/><line x1="110" y1="110" x2="190" y2="165"/>
      <line x1="110" y1="165" x2="190" y2="0"/><line x1="110" y1="165" x2="190" y2="55"/><line x1="110" y1="165" x2="190" y2="110"/><line x1="110" y1="165" x2="190" y2="165"/>
      <!-- layer 3 to output -->
      <line x1="190" y1="0" x2="270" y2="55"/><line x1="190" y1="55" x2="270" y2="55"/><line x1="190" y1="110" x2="270" y2="55"/><line x1="190" y1="165" x2="270" y2="55"/>
    </g>
    <!-- nodes -->
    <g fill="#e9d5ff" stroke="#5b2a86" stroke-width="3">
      <circle cx="30" cy="0" r="17"/><circle cx="30" cy="55" r="17"/><circle cx="30" cy="110" r="17"/><circle cx="30" cy="165" r="17"/>
      <circle cx="110" cy="0" r="17"/><circle cx="110" cy="55" r="17"/><circle cx="110" cy="110" r="17"/><circle cx="110" cy="165" r="17"/>
      <circle cx="190" cy="0" r="17"/><circle cx="190" cy="55" r="17"/><circle cx="190" cy="110" r="17"/><circle cx="190" cy="165" r="17"/>
      <circle cx="270" cy="55" r="17"/>
    </g>
    <text x="30" y="230" text-anchor="middle" font-size="32" fill="#334155">⋮</text>
    <text x="110" y="230" text-anchor="middle" font-size="32" fill="#334155">⋮</text>
    <text x="190" y="230" text-anchor="middle" font-size="32" fill="#334155">⋮</text>
    <text x="270" y="230" text-anchor="middle" font-size="32" fill="#334155">⋮</text>
  </g>
  <text x="2215" y="860" text-anchor="middle" class="body">The model can learn</text>
  <text x="2215" y="894" text-anchor="middle" class="body">patterns and make</text>
  <text x="2215" y="928" text-anchor="middle" class="body">predictions</text>

  <!-- bottom braces and captions -->
  <path d="M38 1085 C38 1110, 54 1110, 72 1110 H195 C205 1110, 210 1124, 216 1135 C222 1124, 227 1110, 237 1110 H370 C388 1110, 396 1100, 396 1085" fill="none" stroke="#334155" stroke-width="2.5"/>
  <text x="216" y="1170" text-anchor="middle" class="body red-text">Unusable by model</text>

  <path d="M435 1085 C435 1110, 455 1110, 475 1110 H995 C1005 1110, 1010 1124, 1016 1135 C1022 1124, 1027 1110, 1037 1110 H1560 C1585 1110, 1595 1100, 1595 1085" fill="none" stroke="#334155" stroke-width="2.5"/>
  <text x="1016" y="1170" text-anchor="middle" class="body blue-text">Preprocessing: make data usable</text>

  <path d="M1652 1085 C1652 1110, 1668 1110, 1686 1110 H1799 C1809 1110, 1814 1124, 1820 1135 C1826 1124, 1831 1110, 1841 1110 H1954 C1970 1110, 1988 1110, 1988 1085" fill="none" stroke="#334155" stroke-width="2.5"/>
  <text x="1820" y="1170" text-anchor="middle" class="body green-text">Usable by model</text>
</svg>
